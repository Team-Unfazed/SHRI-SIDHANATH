    <script>
      /* `?nomotion=1` renders the page in its final state with every entrance
         suppressed. It behaves exactly like the user's own reduced-motion
         preference and is what the screenshot harness uses — a full-page
         screenshot cannot drive scroll-linked reveals reliably. */
      document.documentElement.classList.add('js');
      if (new URLSearchParams(window.location.search).has('nomotion')) {
        document.documentElement.classList.add('nomotion');
      }
